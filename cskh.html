<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ONELAB — CSKH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo-dot">OL</div>
    <div>
      <div class="brandname">ONELAB</div>
      <div class="pagetitle">CSKH — Duyệt &amp; điều phối <span id="countBadge" style="display:none;background:var(--danger);color:#fff;border-radius:999px;padding:2px 9px;font-size:13px;vertical-align:middle;"></span></div>
    </div>
  </div>

  <div class="card" id="pinCard">
    <label class="first">Mã PIN CSKH</label>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••">
    <button class="btn" id="loadBtn">Vào danh sách</button>
    <div id="loginMsg"></div>
  </div>

  <div id="queue"></div>
</div>

<script src="config.js"></script>
<script>
let PIN = '';
let NURSES = [];
let knownCodes = new Set();
let pollTimer = null;

// Hiện số lượng ngay khi mở trang, chưa cần nhập PIN
async function showPublicCount() {
  try {
    const res = await callApi('getPublicCount', { role: 'cskh' });
    const badge = document.getElementById('countBadge');
    if (res.ok && res.count > 0) {
      badge.style.display = 'inline-block';
      badge.textContent = String(res.count).padStart(2, '0');
    } else {
      badge.style.display = 'none';
    }
  } catch (e) {}
}
showPublicCount();
let publicCountTimer = setInterval(showPublicCount, 20000); // cập nhật số ngay cả khi chưa đăng nhập

document.getElementById('loadBtn').addEventListener('click', () => loadQueue(true));

async function loadQueue(isFirstLoad) {
  PIN = document.getElementById('pin').value.trim();
  const loginMsg = document.getElementById('loginMsg');
  loginMsg.innerHTML = '';
  if (!PIN) return;

  let res, nurseRes;
  try {
    [res, nurseRes] = await Promise.all([
      callApi('listQueue', { role: 'cskh', pin: PIN }),
      callApi('listNurses', {})
    ]);
  } catch (err) {
    loginMsg.innerHTML = `<div class="msg err">Không kết nối được hệ thống. Kiểm tra lại config.js (URL Apps Script) hoặc mạng internet. (${err})</div>`;
    return;
  }
  if (!res.ok) {
    loginMsg.innerHTML = `<div class="msg err">${res.error}</div>`;
    return;
  }
  NURSES = nurseRes.ok ? nurseRes.data : [];
  loginMsg.innerHTML = `<div class="msg ok">Xin chào ${res.who}</div>`;
  checkNewBookings(res.data);
  renderQueue(res.data);

  if (isFirstLoad) {
    if (publicCountTimer) clearInterval(publicCountTimer);
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => loadQueue(false), 20000); // tự kiểm tra mỗi 20 giây
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
}

function checkNewBookings(list) {
  const currentCodes = new Set(list.map(b => b.maBooking + ':' + b.trangThai));
  if (knownCodes.size > 0) {
    const newOnes = list.filter(b => !Array.from(knownCodes).some(k => k.startsWith(b.maBooking + ':')));
    if (newOnes.length > 0) alertNewBooking(newOnes.length + ' booking mới cần duyệt');
  }
  knownCodes = currentCodes;
}

function alertNewBooking(text) {
  playBeep();
  document.title = '🔔 ' + text;
  setTimeout(() => { document.title = 'ONELAB — CSKH'; }, 8000);
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('ONELAB CSKH', { body: text });
  }
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(() => o.stop(), 220);
  } catch (e) {}
}

let CURRENT_LIST = [];

function renderQueue(list) {
  CURRENT_LIST = list;
  const q = document.getElementById('queue');
  const badge = document.getElementById('countBadge');
  if (list.length > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = String(list.length).padStart(2, '0');
  } else {
    badge.style.display = 'none';
  }
  if (list.length === 0) {
    q.innerHTML = '<div class="card mint">Không có booking nào đang chờ xử lý. 🎉</div>';
    return;
  }
  q.innerHTML = list.map(itemHtml).join('');
}

// Cập nhật 1 booking tại chỗ trên trình duyệt (không cần gọi lại server) — nhanh hơn nhiều so với loadQueue lại từ đầu
function patchAndRerender(maBooking, patch) {
  const idx = CURRENT_LIST.findIndex(b => b.maBooking === maBooking);
  if (idx === -1) return;
  Object.assign(CURRENT_LIST[idx], patch);
  const st = Number(CURRENT_LIST[idx].trangThai);
  if (st < 1 || st > 4) CURRENT_LIST.splice(idx, 1); // ra khỏi phạm vi CSKH xử lý (VD bị từ chối) -> bỏ khỏi danh sách
  renderQueue(CURRENT_LIST);
}

function itemHtml(b) {
  const isPriority = b.mucUuTien && b.mucUuTien !== 'Thường';
  const st = Number(b.trangThai);
  const waitingApprove = st === 1;
  const waitingAssign = st === 2;
  const alreadyAssigned = st >= 3;
  return `
  <div class="card" style="${isPriority ? 'border-color:#C0392B;' : ''}">
    <div style="display:flex;justify-content:space-between;">
      <strong>${b.maBooking}</strong>
      ${isPriority ? `<span class="badge st-0">${b.mucUuTien}</span>` : `<span class="badge st-${st}">${b.trangThaiLabel}</span>`}
    </div>
    <div class="hint" style="margin-top:4px;">
      ${b.tenKH}${b.ngaySinh ? ' (' + b.ngaySinh + ')' : ''} · ${b.sdt}<br>${b.diaChi}<br>${b.dichVu} · ${b.hinhThuc}<br>Hẹn: ${b.ngayHen} ${b.khungGio}<br>Trả KQ: ${b.hinhThucTraKQ || '—'}<br>Tạo lúc: ${b.thoiGianTao}
    </div>
    ${b.ghiChu ? `<div class="hint" style="margin-top:6px;font-style:italic;">Ghi chú Sale: ${b.ghiChu}</div>` : ''}

    ${waitingApprove ? `
      <label>Thời gian dự kiến lấy mẫu</label>
      <input type="text" id="eta-${b.maBooking}" placeholder="VD: 14:00 hôm nay">
      <div class="qbtn-row" style="margin-top:12px;">
        <button class="btn" onclick="approve('${b.maBooking}', this)">Duyệt</button>
        <button class="btn danger" onclick="reject('${b.maBooking}')">Từ chối</button>
      </div>
    ` : ''}

    ${waitingAssign ? `
      <label>Điều dưỡng phụ trách <span class="hint" style="display:inline;">(chọn xong là điều phối ngay)</span></label>
      <select id="nurse-${b.maBooking}">
        <option value="">-- Chọn điều dưỡng --</option>
        ${NURSES.map(n => `<option value="${n}">${n}</option>`).join('')}
      </select>
      <button class="btn" onclick="assign('${b.maBooking}', this)">Điều phối ngay</button>
    ` : ''}

    ${alreadyAssigned ? `
      <div class="hint" style="margin-top:6px;">Đã điều phối: <strong style="color:var(--text);">${b.nguoiPhuTrach || '—'}</strong></div>
      <details style="margin-top:8px;">
        <summary style="cursor:pointer;font-size:13px;color:var(--muted);">Đổi điều dưỡng khác</summary>
        <select id="renurse-${b.maBooking}" style="margin-top:8px;">
          <option value="">-- Chọn điều dưỡng mới --</option>
          ${NURSES.filter(n => n !== b.nguoiPhuTrach).map(n => `<option value="${n}">${n}</option>`).join('')}
        </select>
        <button class="btn danger" style="margin-top:8px;" onclick="reassign('${b.maBooking}')">Xác nhận đổi</button>
      </details>
    ` : ''}
    <div id="msg-${b.maBooking}"></div>
  </div>`;
}


async function approve(code, btn) {
  const eta = document.getElementById('eta-' + code).value.trim();
  if (!eta) {
    showMsg(code, { ok: false, error: 'Vui lòng nhập Thời gian dự kiến lấy mẫu trước khi Duyệt.' });
    document.getElementById('eta-' + code).focus();
    return;
  }
  btn.disabled = true; btn.textContent = 'Đang duyệt...';
  const res = await callApi('approveBooking', { maBooking: code, pin: PIN, thoiGianDuKien: eta });
  if (res.ok) {
    patchAndRerender(code, { trangThai: 2, thoiGianDuKien: eta });
  } else {
    showMsg(code, res);
    btn.disabled = false; btn.textContent = 'Duyệt';
  }
}

async function reject(code) {
  const lyDo = prompt('Lý do từ chối:');
  if (lyDo === null) return;
  const res = await callApi('rejectBooking', { maBooking: code, pin: PIN, lyDo });
  if (res.ok) {
    patchAndRerender(code, { trangThai: 0 });
  } else {
    showMsg(code, res);
  }
}

async function assign(code, btn) {
  const ten = document.getElementById('nurse-' + code).value;
  if (!ten) {
    showMsg(code, { ok: false, error: 'Vui lòng chọn tên điều dưỡng trước khi điều phối.' });
    return;
  }
  btn.disabled = true; btn.textContent = 'Đang điều phối...';
  const res = await callApi('assignNurse', { maBooking: code, pin: PIN, tenDieuDuong: ten });
  if (res.ok) {
    patchAndRerender(code, { trangThai: 3, nguoiPhuTrach: ten });
  } else {
    showMsg(code, res);
    btn.disabled = false; btn.textContent = 'Điều phối ngay';
  }
}

async function reassign(code) {
  const tenMoi = document.getElementById('renurse-' + code).value;
  if (!tenMoi) {
    showMsg(code, { ok: false, error: 'Vui lòng chọn điều dưỡng mới trước khi đổi.' });
    return;
  }
  if (!confirm('Xác nhận đổi điều dưỡng phụ trách cho booking ' + code + '?')) return;
  const res = await callApi('reassignNurse', { maBooking: code, pin: PIN, tenDieuDuongMoi: tenMoi });
  if (res.ok) {
    patchAndRerender(code, { trangThai: 3, nguoiPhuTrach: tenMoi });
  } else {
    showMsg(code, res);
  }
}

function showMsg(code, res) {
  const el = document.getElementById('msg-' + code);
  if (!el) return;
  el.innerHTML = res.ok
    ? `<div class="msg ok">${res.message}</div>`
    : `<div class="msg err">${res.error}</div>`;
}
</script>
</body>
</html>
